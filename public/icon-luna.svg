<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Gradiente -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#24143d"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </radialGradient>

    <!-- Corpo Luna Gradiente -->
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#140a24"/>
    </linearGradient>

    <!-- Laço Gradiente -->
    <linearGradient id="bow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6bcfa"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#805ad5"/>
    </linearGradient>
  </defs>

  <!-- Fundo Circular Escuro -->
  <circle cx="256" cy="256" r="256" fill="url(#bg-grad)"/>

  <!-- Brilho Neon Atrás da Luna -->
  <circle cx="256" cy="270" r="160" fill="#b794f4" opacity="0.15" filter="blur(20px)"/>

  <!-- Corpo da Luna (Superelipse Fofa) -->
  <rect x="116" y="160" width="280" height="220" rx="95" ry="95" fill="url(#body-grad)" stroke="#c084fc" stroke-width="5"/>

  <!-- Bochechas Rosadas -->
  <ellipse cx="170" cy="290" rx="28" ry="16" fill="#f687b3" opacity="0.6"/>
  <ellipse cx="342" cy="290" rx="28" ry="16" fill="#f687b3" opacity="0.6"/>

  <!-- Olhos Estilo Anime Doce -->
  <!-- Olho Esquerdo -->
  <circle cx="195" cy="250" r="24" fill="#0d0617" stroke="#c084fc" stroke-width="3"/>
  <circle cx="202" cy="244" r="9" fill="#ffffff"/>
  <circle cx="189" cy="256" r="4.5" fill="#ffffff" opacity="0.8"/>

  <!-- Olho Direito -->
  <circle cx="317" cy="250" r="24" fill="#0d0617" stroke="#c084fc" stroke-width="3"/>
  <circle cx="324" cy="244" r="9" fill="#ffffff"/>
  <circle cx="311" cy="256" r="4.5" fill="#ffffff" opacity="0.8"/>

  <!-- Sorriso Doce -->
  <path d="M 238 290 Q 256 308 274 290" fill="none" stroke="#c084fc" stroke-width="4.5" stroke-linecap="round"/>

  <!-- O Laço na Cabeça (Topo Direito) -->
  <g transform="translate(340, 155) rotate(15)">
    <!-- Fitas Caídas do Laço -->
    <path d="M -5 10 Q -15 45 -22 65 L -10 60 Q -2 35 0 10 Z" fill="#805ad5" stroke="#c084fc" stroke-width="2"/>
    <path d="M 5 10 Q 15 45 22 65 L 10 60 Q 2 35 0 10 Z" fill="#805ad5" stroke="#c084fc" stroke-width="2"/>

    <!-- Asas do Laço -->
    <!-- Asa Esquerda -->
    <path d="M -2 0 C -35 -25 -55 -5 -40 10 C -25 25 -5 10 -2 0 Z" fill="url(#bow-grad)" stroke="#e9d8fd" stroke-width="2.5"/>
    <!-- Asa Direita -->
    <path d="M 2 0 C 35 -25 55 -5 40 10 C 25 25 5 10 2 0 Z" fill="url(#bow-grad)" stroke="#e9d8fd" stroke-width="2.5"/>

    <!-- Nó Central -->
    <circle cx="0" cy="0" r="14" fill="#e9d8fd" stroke="#805ad5" stroke-width="3"/>
  </g>
</svg>
