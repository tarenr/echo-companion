<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Grok Bot // Animação com Bracinhos e Óculos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Levitação suave ociosa */
    @keyframes floatHead {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-10px) rotate(1deg) scale(1.02); }
    }

    /* Satélite orbital */
    @keyframes floatSatellite {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.08); }
    }

    /* Piscada elástica */
    @keyframes blinkEyes {
      0%, 93%, 97%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }

    /* Brilho pulsante */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 30px rgba(78, 175, 255, 0.35), inset 0 -8px 16px rgba(10, 35, 60, 0.6); }
      50% { box-shadow: 0 0 55px rgba(78, 175, 255, 0.7), inset 0 -8px 16px rgba(10, 35, 60, 0.3); }
    }

    /* Barras do equalizador */
    @keyframes wave1 { 0%, 100% { height: 5px; } 50% { height: 14px; } }
    @keyframes wave2 { 0%, 100% { height: 13px; } 50% { height: 4px; } }
    @keyframes wave3 { 0%, 100% { height: 7px; } 50% { height: 15px; } }

    /* Braços - Digitando / Codando */
    @keyframes typingLeft {
      0%, 100% { transform: translateY(0px) rotate(-15deg); }
      50% { transform: translateY(-8px) rotate(-28deg); }
    }
    @keyframes typingRight {
      0%, 100% { transform: translateY(-8px) rotate(28deg); }
      50% { transform: translateY(0px) rotate(15deg); }
    }

    /* Braços - Comemorando */
    @keyframes cheerLeft {
      0%, 100% { transform: translate(-8px, -24px) rotate(-45deg); }
      50% { transform: translate(-10px, -30px) rotate(-60deg); }
    }
    @keyframes cheerRight {
      0%, 100% { transform: translate(8px, -24px) rotate(45deg); }
      50% { transform: translate(10px, -30px) rotate(60deg); }
    }

    /* Braço - Acenando */
    @keyframes waveHand {
      0%, 100% { transform: translate(8px, -26px) rotate(35deg); }
      50% { transform: translate(10px, -24px) rotate(65deg); }
    }

    /* Salto elástico de comemoração */
    @keyframes jumpCelebration {
      0% { transform: translateY(0) scale(1, 1); }
      20% { transform: translateY(8px) scale(1.15, 0.85); }
      50% { transform: translateY(-32px) scale(0.9, 1.15); }
      75% { transform: translateY(0px) scale(1.08, 0.92); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    /* Tremor cômico de erro */
    @keyframes errorGlitch {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-6px, 4px) rotate(-4deg); }
      40% { transform: translate(6px, -4px) rotate(4deg); }
      60% { transform: translate(-5px, -3px) rotate(-3deg); }
      80% { transform: translate(5px, 3px) rotate(3deg); }
    }

    /* Reflexo de luz nos óculos */
    @keyframes glassesGlare {
      0%, 100% { opacity: 0.6; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(4px); }
    }

    /* Classes auxiliares */
    .head-orb {
      animation: floatHead 3.8s ease-in-out infinite, pulseGlow 3.8s ease-in-out infinite;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .satellite-badge {
      animation: floatSatellite 2.8s ease-in-out infinite;
    }
    .eyes-capsule {
      animation: blinkEyes 4.2s infinite;
      transform-origin: center;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .arm {
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: top center;
    }
    .glasses {
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .wave-1 { animation: wave1 0.75s ease-in-out infinite; }
    .wave-2 { animation: wave2 0.65s ease-in-out infinite 0.15s; }
    .wave-3 { animation: wave3 0.85s ease-in-out infinite 0.05s; }
  </style>
</head>
<body class="bg-[#05080e] text-slate-100 min-h-screen p-4 flex flex-col items-center justify-between font-sans antialiased select-none">

  <!-- Topo -->
  <div class="text-center mt-2 max-w-sm">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/30 text-blue-400 text-xs font-semibold uppercase tracking-wider mb-2">
      <span class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></span>
      Grok Bot 2.0 // Bracinhos & Óculos
    </div>
    <h1 class="text-xl font-bold tracking-tight text-white">Animação & Reações Expandidas</h1>
  </div>

  <!-- Palco Central: Mascote Completo -->
  <div class="w-full max-w-sm bg-[#0c111a]/90 border border-slate-800/80 rounded-3xl p-6 shadow-2xl flex flex-col items-center justify-center relative overflow-hidden backdrop-blur-xl min-h-[300px] my-3">
    
    <!-- Wrapper do Mascote e Membros -->
    <div id="character-wrapper" class="relative my-auto flex items-center justify-center">

      <!-- ============================================== -->
      <!-- BRAÇO ESQUERDO -->
      <!-- ============================================== -->
      <div id="arm-left" class="arm absolute -left-7 bottom-4 z-10 opacity-0 pointer-events-none">
        <div class="w-5 h-14 rounded-full bg-gradient-to-b from-[#68b2e3] to-[#255d85] border border-blue-400/30 shadow-md relative">
          <!-- Mãozinha -->
          <div class="w-6 h-6 rounded-full bg-[#82c6f5] absolute -bottom-1 -left-0.5 shadow-inner"></div>
        </div>
      </div>

      <!-- ============================================== -->
      <!-- SATÉLITE DE STATUS -->
      <!-- ============================================== -->
      <div id="sat-1" class="satellite-badge absolute -top-2 -left-3 z-30 w-8 h-8 rounded-full bg-[#173b57] border border-[#3b8ac4]/60 flex items-center justify-center shadow-lg">
        <div class="flex items-center gap-[2.5px] h-3.5" id="sat-content">
          <span class="w-[3px] bg-[#61b8f5] rounded-full wave-1"></span>
          <span class="w-[3px] bg-[#61b8f5] rounded-full wave-2"></span>
          <span class="w-[3px] bg-[#61b8f5] rounded-full wave-3"></span>
        </div>
      </div>

      <!-- ============================================== -->
      <!-- CABEÇA / ESFERA 2.5D -->
      <!-- ============================================== -->
      <div id="head-1" class="head-orb w-36 h-36 rounded-full relative flex items-center justify-center cursor-pointer"
           style="background: radial-gradient(circle at 35% 30%, #bde4ff 0%, #68b2e3 42%, #2d6b99 80%, #153852 100%);">

        <!-- ============================================== -->
        <!-- ÓCULOS DE PENSADOR (SLIDE IN / OUT) -->
        <!-- ============================================== -->
        <div id="glasses" class="glasses absolute top-9 z-20 opacity-0 pointer-events-none transform -translate-y-8 scale-90">
          <svg viewBox="0 0 110 44" class="w-28 h-11 drop-shadow-[0_4px_10px_rgba(0,0,0,0.5)]">
            <!-- Armação e Lente Esquerda -->
            <rect x="6" y="6" width="42" height="30" rx="10" fill="rgba(11, 27, 41, 0.75)" stroke="#60a5fa" stroke-width="2.8" />
            <!-- Armação e Lente Direita -->
            <rect x="62" y="6" width="42" height="30" rx="10" fill="rgba(11, 27, 41, 0.75)" stroke="#60a5fa" stroke-width="2.8" />
            <!-- Ponte Central -->
            <path d="M48 20 Q 55 14 62 20" fill="none" stroke="#60a5fa" stroke-width="2.8" stroke-linecap="round" />
            <!-- Hastes Laterais -->
            <path d="M6 18 Q 0 16 -3 20" fill="none" stroke="#60a5fa" stroke-width="2.5" />
            <path d="M104 18 Q 110 16 113 20" fill="none" stroke="#60a5fa" stroke-width="2.5" />
            <!-- Brilho / Reflexo Diagonal nas Lentes -->
            <line x1="14" y1="10" x2="34" y2="30" stroke="rgba(255,255,255,0.75)" stroke-width="2" stroke-linecap="round" style="animation: glassesGlare 2.5s infinite;" />
            <line x1="70" y1="10" x2="90" y2="30" stroke="rgba(255,255,255,0.75)" stroke-width="2" stroke-linecap="round" style="animation: glassesGlare 2.5s infinite 0.3s;" />
          </svg>
        </div>

        <!-- ============================================== -->
        <!-- OLHOS DE CÁPSULA -->
        <!-- ============================================== -->
        <div id="eyes-1" class="eyes-capsule flex items-center gap-4 mt-1">
          <span id="eye-l" class="w-4 h-9 bg-[#0b1b29] rounded-full shadow-inner"></span>
          <span id="eye-r" class="w-4 h-9 bg-[#0b1b29] rounded-full shadow-inner"></span>
        </div>

      </div>

      <!-- ============================================== -->
      <!-- BRAÇO DIREITO -->
      <!-- ============================================== -->
      <div id="arm-right" class="arm absolute -right-7 bottom-4 z-10 opacity-0 pointer-events-none">
        <div class="w-5 h-14 rounded-full bg-gradient-to-b from-[#68b2e3] to-[#255d85] border border-blue-400/30 shadow-md relative">
          <!-- Mãozinha -->
          <div class="w-6 h-6 rounded-full bg-[#82c6f5] absolute -bottom-1 -right-0.5 shadow-inner"></div>
        </div>
      </div>

    </div>

    <!-- Feedback de Texto -->
    <div class="text-center mt-5">
      <div class="text-base font-semibold text-white tracking-wide" id="label-state-1">Grok Bot Ativo (Ocioso)</div>
      <div class="text-xs text-blue-400 font-medium mt-0.5" id="label-sub-1">Levitação suave com olhos acompanhando o ambiente</div>
    </div>
  </div>

  <!-- Botões de Ação para o Celular -->
  <div class="w-full max-w-sm bg-slate-900/90 border border-slate-800 rounded-3xl p-3 flex flex-col gap-2 mb-2 backdrop-blur-md">
    <div class="text-[11px] font-mono tracking-wider text-slate-400 text-center uppercase">TOQUE PARA MUDAR A AÇÃO:</div>
    
    <div class="grid grid-cols-2 gap-2">
      <!-- 1. Pensando com Óculos -->
      <button onclick="setMode('thinking')" class="px-3 py-2.5 rounded-2xl bg-indigo-600/25 border border-indigo-500/40 text-indigo-300 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
        👓 <span>Pensando (Óculos)</span>
      </button>

      <!-- 2. Codando com Braços -->
      <button onclick="setMode('coding')" class="px-3 py-2.5 rounded-2xl bg-cyan-600/25 border border-cyan-500/40 text-cyan-300 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
        💻 <span>Codando (Braços)</span>
      </button>

      <!-- 3. Vitória / Comemoração -->
      <button onclick="setMode('victory')" class="px-3 py-2.5 rounded-2xl bg-emerald-600/25 border border-emerald-500/40 text-emerald-300 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
        🎉 <span>Vitória (Salto)</span>
      </button>

      <!-- 4. Acenando -->
      <button onclick="setMode('waving')" class="px-3 py-2.5 rounded-2xl bg-amber-600/25 border border-amber-500/40 text-amber-300 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
        👋 <span>Acenando (Tchau)</span>
      </button>

      <!-- 5. Ocioso / Respiração -->
      <button onclick="setMode('idle')" class="px-3 py-2.5 rounded-2xl bg-slate-800 border border-slate-700 text-slate-300 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
        💤 <span>Ocioso Normal</span>
      </button>

      <!-- 6. Erro com Tremor -->
      <button onclick="setMode('error')" class="px-3 py-2.5 rounded-2xl bg-rose-600/25 border border-rose-500/40 text-rose-300 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
        ⚠️ <span>Curto / Erro</span>
      </button>
    </div>
  </div>

  <script>
    const wrapper = document.getElementById('character-wrapper');
    const head = document.getElementById('head-1');
    const eyes = document.getElementById('eyes-1');
    const eyeL = document.getElementById('eye-l');
    const eyeR = document.getElementById('eye-r');
    const sat = document.getElementById('sat-1');
    const armL = document.getElementById('arm-left');
    const armR = document.getElementById('arm-right');
    const glasses = document.getElementById('glasses');
    const labelState = document.getElementById('label-state-1');
    const labelSub = document.getElementById('label-sub-1');

    function resetAll() {
      // Reseta classes de animações de braços e cabeça
      wrapper.style.animation = '';
      head.style.animation = 'floatHead 3.8s ease-in-out infinite, pulseGlow 3.8s ease-in-out infinite';
      head.style.transform = '';
      
      armL.style.animation = '';
      armL.style.transform = '';
      armL.classList.add('opacity-0');
      
      armR.style.animation = '';
      armR.style.transform = '';
      armR.classList.add('opacity-0');

      glasses.classList.add('opacity-0', '-translate-y-8', 'scale-90');
      glasses.classList.remove('opacity-100', 'translate-y-0', 'scale-100');

      sat.innerHTML = `
        <div class="flex items-center gap-[2.5px] h-3.5">
          <span class="w-[3px] bg-[#61b8f5] rounded-full wave-1"></span>
          <span class="w-[3px] bg-[#61b8f5] rounded-full wave-2"></span>
          <span class="w-[3px] bg-[#61b8f5] rounded-full wave-3"></span>
        </div>
      `;
    }

    function setMode(mode) {
      resetAll();

      if (mode === 'idle') {
        head.style.background = 'radial-gradient(circle at 35% 30%, #bde4ff 0%, #68b2e3 42%, #2d6b99 80%, #153852 100%)';
        eyes.innerHTML = `
          <span class="w-4 h-9 bg-[#0b1b29] rounded-full shadow-inner"></span>
          <span class="w-4 h-9 bg-[#0b1b29] rounded-full shadow-inner"></span>
        `;
        labelState.textContent = 'Grok Bot Ativo (Ocioso)';
        labelSub.textContent = 'Levitação suave com olhos atentos ao ambiente';
      }

      // ==========================================
      // 1. PENSANDO: Óculos descem + mão no queixo
      // ==========================================
      else if (mode === 'thinking') {
        head.style.background = 'radial-gradient(circle at 35% 30%, #d4eeff 0%, #7db9e6 42%, #326f9c 80%, #163e5e 100%)';
        head.style.transform = 'rotate(-5deg)';
        
        // Olhos olhando para cima/pensativo
        eyes.innerHTML = `
          <span class="w-3.5 h-6 bg-[#0b1b29] rounded-full transform translate-y-[-2px] translate-x-[3px] shadow-inner"></span>
          <span class="w-3.5 h-6 bg-[#0b1b29] rounded-full transform translate-y-[-2px] translate-x-[3px] shadow-inner"></span>
        `;

        // Desce os Óculos
        glasses.classList.remove('opacity-0', '-translate-y-8', 'scale-90');
        glasses.classList.add('opacity-100', 'translate-y-0', 'scale-100');

        // Mãozinha esquerda sobe no queixo
        armL.classList.remove('opacity-0');
        armL.style.transform = 'translate(14px, -18px) rotate(42deg)';

        labelState.textContent = '🧠 Modo Analítico (Pensando)';
        labelSub.textContent = 'Óculos ativados e calculando raciocínio';
      }

      // ==========================================
      // 2. CODANDO: Dois bracinhos digitando rápido
      // ==========================================
      else if (mode === 'coding') {
        head.style.background = 'radial-gradient(circle at 35% 30%, #b8f5ff 0%, #52d3ec 42%, #1b859e 80%, #0d4654 100%)';
        
        // Olhos focados e atentos
        eyes.innerHTML = `
          <span class="w-4 h-7 bg-[#051c22] rounded-full shadow-inner"></span>
          <span class="w-4 h-7 bg-[#051c22] rounded-full shadow-inner"></span>
        `;

        // Ativa os dois braços digitando
        armL.classList.remove('opacity-0');
        armR.classList.remove('opacity-0');
        armL.style.animation = 'typingLeft 0.3s ease-in-out infinite alternate';
        armR.style.animation = 'typingRight 0.3s ease-in-out infinite alternate';

        labelState.textContent = '💻 Codando a Todo Vapor!';
        labelSub.textContent = 'Braços digitando scripts e executando tarefas';
      }

      // ==========================================
      // 3. VITÓRIA / SUCESSO: Salto e braços no ar
      // ==========================================
      else if (mode === 'victory') {
        head.style.background = 'radial-gradient(circle at 35% 30%, #c2ffd9 0%, #4ce49a 42%, #16935b 80%, #0c5233 100%)';
        
        // Olhos sorrindo (arcos)
        eyes.innerHTML = `
          <span class="w-5 h-4 border-t-4 border-emerald-950 rounded-t-full"></span>
          <span class="w-5 h-4 border-t-4 border-emerald-950 rounded-t-full"></span>
        `;

        // Braços erguidos comemorando
        armL.classList.remove('opacity-0');
        armR.classList.remove('opacity-0');
        armL.style.animation = 'cheerLeft 0.5s ease-in-out infinite';
        armR.style.animation = 'cheerRight 0.5s ease-in-out infinite';

        // Pula com celebração
        wrapper.style.animation = 'jumpCelebration 1s ease-in-out infinite';

        labelState.textContent = '🎉 Sucesso Absoluto!';
        labelSub.textContent = 'Tarefa concluída e comemoração ativada';
      }

      // ==========================================
      // 4. ACENANDO: Braço direito dando tchau
      // ==========================================
      else if (mode === 'waving') {
        head.style.background = 'radial-gradient(circle at 35% 30%, #fff0c7 0%, #f7c963 42%, #a87e22 80%, #57400d 100%)';
        head.style.transform = 'rotate(4deg)';

        eyes.innerHTML = `
          <span class="w-4 h-8 bg-[#2d2208] rounded-full shadow-inner"></span>
          <span class="w-4 h-8 bg-[#2d2208] rounded-full shadow-inner"></span>
        `;

        armR.classList.remove('opacity-0');
        armR.style.animation = 'waveHand 0.4s ease-in-out infinite';

        labelState.textContent = '👋 Olá Mestre!';
        labelSub.textContent = 'Acenando e chamando sua atenção';
      }

      // ==========================================
      // 5. ERRO: Tremor de glitch + fendas
      // ==========================================
      else if (mode === 'error') {
        head.style.background = 'radial-gradient(circle at 35% 30%, #ffd4d4 0%, #f87171 45%, #b91c1c 85%, #5c0d0d 100%)';
        head.style.animation = 'errorGlitch 0.25s infinite';

        eyes.innerHTML = `
          <span class="w-5 h-1.5 bg-[#3f0707] rounded-full"></span>
          <span class="w-5 h-1.5 bg-[#3f0707] rounded-full"></span>
        `;

        sat.innerHTML = `<span class="w-4 h-4 bg-red-500 rounded-full animate-ping"></span>`;

        labelState.textContent = '⚠️ Curto-Circuito / Falha';
        labelSub.textContent = 'Comando encontrou erro de execução';
      }
    }
  </script>
</body>
</html>
