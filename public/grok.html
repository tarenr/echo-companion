<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Grok & Coucou Bot // Laboratório Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos e animações para complementos mecânicos */
    @keyframes crtBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes crtScan {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }
    @keyframes floppyInsert {
      0% { transform: translateY(50px) scale(0.9); opacity: 0; }
      40% { transform: translateY(12px) scale(1); opacity: 1; }
      75% { transform: translateY(4px); }
      100% { transform: translateY(0px); opacity: 1; }
    }
    @keyframes paperFeedOut {
      0% { transform: translateY(-35px) scale(0.95); opacity: 0; }
      25% { transform: translateY(-18px) scale(1); opacity: 1; }
      60% { transform: translateY(2px); }
      100% { transform: translateY(14px); opacity: 1; }
    }
    @keyframes rocketFlame {
      0%, 100% { transform: scaleY(1) scaleX(1); filter: drop-shadow(0 0 12px #f97316); }
      50% { transform: scaleY(1.25) scaleX(0.9); filter: drop-shadow(0 0 22px #ef4444); }
    }
    @keyframes coffeeSteam {
      0% { transform: translateY(0) scaleX(0.8); opacity: 0.7; }
      50% { transform: translateY(-16px) scaleX(1.2); opacity: 0.4; }
      100% { transform: translateY(-32px) scaleX(1.5); opacity: 0; }
    }
    @keyframes coffeeDrop {
      0% { transform: translateY(0); opacity: 1; }
      75% { transform: translateY(18px); opacity: 1; }
      100% { transform: translateY(22px); opacity: 0; }
    }
    @keyframes nerdSheen {
      0%, 100% { opacity: 0.35; transform: translateX(-3px); }
      50% { opacity: 0.95; transform: translateX(3px); }
    }
    @keyframes speakMouthPulse {
      0%, 100% { transform: scaleY(0.4) scaleX(0.8); }
      50% { transform: scaleY(1.3) scaleX(1.15); }
    }
    @keyframes wavePulse {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    .canvas-bot {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-[#03060c] text-slate-100 min-h-screen p-3 md:p-6 flex flex-col items-center justify-between font-sans antialiased select-none overflow-x-hidden">

  <!-- Header -->
  <header class="text-center mt-0.5 w-full max-w-sm">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/30 text-blue-400 text-[11px] font-semibold uppercase tracking-wider mb-1">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      Coucou & Grok Bot // 60 FPS Canvas Engine
    </div>
    <h1 class="text-lg font-bold tracking-tight text-white">Física do Coucou & Transformações</h1>
    <p class="text-xs text-slate-400">Toque no robô para amassar (squash) ou arraste o dedo para ele seguir seu olhar!</p>
  </header>

  <!-- Palco Central -->
  <main class="w-full max-w-sm bg-[#090e17]/90 border border-slate-800/80 rounded-[32px] p-4 shadow-2xl flex flex-col items-center justify-center relative overflow-hidden backdrop-blur-2xl min-h-[350px] my-2">
    
    <!-- Satélite de Status Flutuante -->
    <div id="satellite" class="absolute top-4 left-5 z-40 w-8 h-8 rounded-full bg-[#173b57] border border-[#3b8ac4]/60 flex items-center justify-center shadow-lg transition-all duration-300">
      <div id="sat-waves" class="flex items-center gap-[2.5px] h-3.5">
        <span class="w-[3px] bg-[#61b8f5] rounded-full h-2 animate-pulse"></span>
        <span class="w-[3px] bg-[#61b8f5] rounded-full h-3 animate-pulse" style="animation-delay: 0.15s"></span>
        <span class="w-[3px] bg-[#61b8f5] rounded-full h-1.5 animate-pulse" style="animation-delay: 0.3s"></span>
      </div>
    </div>

    <!-- Área de Exibição Central -->
    <div class="relative w-full h-[220px] flex items-center justify-center" id="stage-box">
      
      <!-- CANVAS 2D DO BOT (Coucou Canvas Engine) -->
      <canvas id="botCanvas" width="220" height="220" class="canvas-bot z-20 cursor-pointer drop-shadow-[0_12px_28px_rgba(0,180,255,0.25)]"></canvas>

      <!-- OVERLAY DE OBJETOS TRANSFORMADOS (PC Antigo, Impressora, Foguete, Cafeteira) -->
      <div id="object-overlay" class="absolute inset-0 pointer-events-none z-30 flex items-center justify-center hidden">
        <!-- Injetado dinamicamente -->
      </div>

    </div>

    <!-- Legenda e Estado Atual -->
    <div class="text-center mt-2 w-full z-40">
      <div class="text-base font-semibold text-white tracking-wide" id="label-title">🔵 Ocioso / Respiração Orgânica</div>
      <div class="text-xs text-blue-400 font-medium mt-0.5" id="label-desc">Física elástica Coucou com rastreamento do olhar</div>
      <div id="speech-bubble" class="mt-2 mx-auto max-w-xs bg-blue-950/60 border border-blue-500/40 rounded-2xl p-2 text-xs text-blue-200 hidden shadow-lg">
        💬 "<span id="speech-text">Pronto para transformar ou programar!</span>"
      </div>
    </div>
  </main>

  <!-- Painel de Controles com TODAS as 14 Animações -->
  <footer class="w-full max-w-sm bg-slate-900/90 border border-slate-800 rounded-3xl p-3 flex flex-col gap-2 mb-1 backdrop-blur-md">
    
    <!-- Seletor de Abas (Expressões vs Transformações) -->
    <div class="flex rounded-xl bg-slate-800/80 p-1 border border-slate-700/60 text-xs font-semibold">
      <button id="tab-btn-expr" onclick="switchTab('expr')" class="flex-1 py-1.5 rounded-lg bg-blue-600 text-white transition shadow-sm">
        🎭 Expressões & Poses (10)
      </button>
      <button id="tab-btn-morph" onclick="switchTab('morph')" class="flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition">
        ⚙️ Transformações (4)
      </button>
    </div>

    <!-- ABA 1: EXPRESSÕES & POSES (10 BOTÕES ORIGINAIS INTACTOS) -->
    <div id="tab-expr" class="grid grid-cols-2 gap-1.5 max-h-[170px] overflow-y-auto pr-0.5">
      <button onclick="setMode('idle')" class="px-2 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>🔵</span> <span>Ocioso (Padrão)</span>
      </button>

      <button onclick="setMode('nerd')" class="px-2 py-2 rounded-xl bg-sky-600/20 border border-sky-400/40 text-sky-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>👓</span> <span>Óculos de Grau</span>
      </button>

      <button onclick="setMode('talking')" class="px-2 py-2 rounded-xl bg-blue-600/20 border border-blue-400/40 text-blue-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>🗣️</span> <span>Falando / Voz</span>
      </button>

      <button onclick="setMode('hacker')" class="px-2 py-2 rounded-xl bg-cyan-600/20 border border-cyan-400/40 text-cyan-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>💻</span> <span>Codando Rápido</span>
      </button>

      <button onclick="setMode('dance')" class="px-2 py-2 rounded-xl bg-purple-600/20 border border-purple-400/40 text-purple-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>🕺</span> <span>Dancinha Vitória</span>
      </button>

      <button onclick="setMode('doubt')" class="px-2 py-2 rounded-xl bg-amber-600/20 border border-amber-400/40 text-amber-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>🤔</span> <span>Dúvida (Coçando)</span>
      </button>

      <button onclick="setMode('surprised')" class="px-2 py-2 rounded-xl bg-pink-600/20 border border-pink-400/40 text-pink-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>😲</span> <span>Surpreso (O O)</span>
      </button>

      <button onclick="setMode('call')" class="px-2 py-2 rounded-xl bg-teal-600/20 border border-teal-400/40 text-teal-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>🙌</span> <span>Chamando Você</span>
      </button>

      <button onclick="setMode('sleep')" class="px-2 py-2 rounded-xl bg-indigo-600/20 border border-indigo-400/40 text-indigo-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>😴</span> <span>Dormindo Zzz</span>
      </button>

      <button onclick="setMode('glitch')" class="px-2 py-2 rounded-xl bg-red-600/20 border border-red-400/40 text-red-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>⚡</span> <span>Curto-Circuito</span>
      </button>
    </div>

    <!-- ABA 2: TRANSFORMAÇÕES EM OBJETOS FÍSICOS REAIS (4 NOVOS OBJETOS) -->
    <div id="tab-morph" class="grid grid-cols-2 gap-2 hidden">
      <!-- 1. PC ANTIGO RETRÔ 90s -->
      <button onclick="setMode('pc90s')" class="p-2.5 rounded-2xl bg-amber-600/20 border border-amber-400/40 text-amber-200 text-xs font-bold flex flex-col items-center justify-center gap-1 active:scale-95 transition">
        <span class="text-xl">🖥️</span>
        <span>PC Antigo 90s</span>
        <span class="text-[9px] text-amber-300/80 font-normal">Disquete & Tubo CRT</span>
      </button>

      <!-- 2. IMPRESSORA DE MESA REALISTA -->
      <button onclick="setMode('printer_real')" class="p-2.5 rounded-2xl bg-blue-600/20 border border-blue-400/40 text-blue-200 text-xs font-bold flex flex-col items-center justify-center gap-1 active:scale-95 transition">
        <span class="text-xl">🖨️</span>
        <span>Impressora Real</span>
        <span class="text-[9px] text-blue-300/80 font-normal">Bandeja superior & papel</span>
      </button>

      <!-- 3. FOGUETE DE DEPLOY -->
      <button onclick="setMode('rocket')" class="p-2.5 rounded-2xl bg-red-600/20 border border-red-400/40 text-red-200 text-xs font-bold flex flex-col items-center justify-center gap-1 active:scale-95 transition">
        <span class="text-xl">🚀</span>
        <span>Foguete Deploy</span>
        <span class="text-[9px] text-red-300/80 font-normal">Aletas & Chamas</span>
      </button>

      <!-- 4. CAFETEIRA EXPRESSO DEV -->
      <button onclick="setMode('coffee')" class="p-2.5 rounded-2xl bg-emerald-600/20 border border-emerald-400/40 text-emerald-200 text-xs font-bold flex flex-col items-center justify-center gap-1 active:scale-95 transition">
        <span class="text-xl">☕</span>
        <span>Cafeteira Dev</span>
        <span class="text-[9px] text-emerald-300/80 font-normal">Manômetro & Vapor</span>
      </button>
    </div>

  </footer>

  <!-- SCRIPT DO MOTOR COUCOU (CANVAS 2D) & TRANSFORMAÇÕES -->
  <script>
    // ========================================================
    // MOTOR DE ANIMAÇÃO PARAMÉTRICO ESTILO COUCOU
    // ========================================================
    const canvas = document.getElementById('botCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = 220, H = 220;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    const overlay = document.getElementById('object-overlay');
    const labelTitle = document.getElementById('label-title');
    const labelDesc = document.getElementById('label-desc');
    const speechBubble = document.getElementById('speech-bubble');
    const speechText = document.getElementById('speech-text');
    const satellite = document.getElementById('satellite');

    // Estado físico contínuo do robô
    const bot = {
      // Posição e dimensões
      cx: 110,
      cy: 110,
      r: 58,
      
      // Variáveis físicas e de mola (Coucou params)
      sx: 1, sy: 1,            // Escala X e Y (squash & stretch)
      targetSx: 1, targetSy: 1,
      yaw: 0, pitch: 0, tilt: 0, // Ângulos de orientação
      look: { x: 0, y: 0 },    // Direção da pupila (-1 a 1 via Math.tanh)
      open: 1,                 // Abertura do olho (1 aberto, 0 piscando)
      blush: 0,                // Bochechas rosadas (0 a 1)
      hands: 0,                // Altura dos bracinhos (0 a 1)
      handL: { x: 0, y: 0, rot: 0 },
      handR: { x: 0, y: 0, rot: 0 },

      // Estado atual
      mode: 'idle',
      mouthOpen: 0,            // Abertura da boca falante
      glasses: false,          // Óculos nerd
      baseColorTop: '#bde4ff',
      baseColorMid: '#68b2e3',
      baseColorDark: '#1b4a6d',

      // Temporizadores de ciclo
      nextBlink: performance.now() + 2500,
      isBlinking: false
    };

    // Função de mola elástica (Coucou spring lerp)
    function spring(current, target, speed = 0.15) {
      return current + (target - current) * speed;
    }

    // Squash & Stretch ao tocar (como no Coucou)
    function squashBot() {
      bot.sx = 1.18;
      bot.sy = 0.82;
      bot.blush = 0.8;
      setTimeout(() => { bot.blush = 0; }, 600);
    }
    canvas.addEventListener('pointerdown', squashBot);

    // Eye Tracking seguindo o toque/cursor pela tela (via Tangente Hiperbólica Math.tanh)
    function trackPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - (rect.left + rect.width / 2);
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - (rect.top + rect.height / 2);
      bot.look.x = Math.tanh(x / 140);
      bot.look.y = Math.tanh(y / 140);
    }
    window.addEventListener('pointermove', trackPointer);
    window.addEventListener('touchmove', trackPointer);

    // Alternar Abas no Rodapé
    function switchTab(tab) {
      const expr = document.getElementById('tab-expr');
      const morph = document.getElementById('tab-morph');
      const btnE = document.getElementById('tab-btn-expr');
      const btnM = document.getElementById('tab-btn-morph');

      if (tab === 'expr') {
        expr.classList.remove('hidden');
        morph.classList.add('hidden');
        btnE.className = 'flex-1 py-1.5 rounded-lg bg-blue-600 text-white transition shadow-sm';
        btnM.className = 'flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
      } else {
        morph.classList.remove('hidden');
        expr.classList.add('hidden');
        btnM.className = 'flex-1 py-1.5 rounded-lg bg-blue-600 text-white transition shadow-sm';
        btnE.className = 'flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
      }
    }

    // ========================================================
    // RENDERIZADOR COUCOU (CANVAS 2D)
    // ========================================================
    function drawCoucouBot(t) {
      ctx.clearRect(0, 0, W, H);

      // Se estiver em modo de objeto mecânico pesado (PC 90s, Impressora, Foguete, Cafeteira),
      // o overlay HTML/SVG assume o controle do palco e o Canvas fica sutil.
      if (['pc90s', 'printer_real', 'rocket', 'coffee'].includes(bot.mode)) {
        return;
      }

      // 1. Atualiza Física de Mola
      bot.sx = spring(bot.sx, bot.targetSx, 0.18);
      bot.sy = spring(bot.sy, bot.targetSy, 0.18);

      // Respiração contínua orgânica
      const breath = Math.sin(t / 800) * 0.025;
      const breathY = Math.sin(t / 800) * 3;

      // 2. Piscar Natural
      if (t > bot.nextBlink && !bot.isBlinking) {
        bot.isBlinking = true;
        bot.open = 0;
        setTimeout(() => {
          bot.open = 1;
          bot.isBlinking = false;
          bot.nextBlink = t + 2200 + Math.random() * 3000;
        }, 120);
      }

      ctx.save();
      ctx.translate(bot.cx, bot.cy + breathY);
      ctx.rotate(bot.tilt);
      ctx.scale(bot.sx + breath, bot.sy - breath);

      // ==========================================
      // A) BRAÇOS / MÃOS (Coucou Hands)
      // ==========================================
      if (bot.hands > 0.05) {
        ctx.fillStyle = '#68b2e3';
        ctx.strokeStyle = '#255d85';
        ctx.lineWidth = 3;

        // Mão Esquerda
        ctx.save();
        ctx.translate(bot.handL.x, bot.handL.y);
        ctx.rotate(bot.handL.rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        // Mão Direita
        ctx.save();
        ctx.translate(bot.handR.x, bot.handR.y);
        ctx.rotate(bot.handR.rot);
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 16, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // ==========================================
      // B) CORPO SQUIRCLE 2.5D (Volume em 3 Camadas)
      // ==========================================
      ctx.beginPath();
      ctx.arc(0, 0, bot.r, 0, Math.PI * 2);

      // Camada 1: Gradiente base luminoso
      const gBase = ctx.createRadialGradient(-18, -20, 8, 0, 0, bot.r * 1.05);
      gBase.addColorStop(0, bot.baseColorTop);
      gBase.addColorStop(0.45, bot.baseColorMid);
      gBase.addColorStop(1, bot.baseColorDark);
      ctx.fillStyle = gBase;
      ctx.fill();

      // Camada 2: Sombra de Oclusão na base inferior
      const gShadow = ctx.createLinearGradient(0, bot.r * 0.2, 0, bot.r);
      gShadow.addColorStop(0, 'rgba(10, 25, 45, 0)');
      gShadow.addColorStop(1, 'rgba(8, 20, 36, 0.65)');
      ctx.fillStyle = gShadow;
      ctx.fill();

      // Camada 3: Brilho Especular Superior (Highlight silicone/vidro)
      const gHighlight = ctx.createRadialGradient(-bot.r * 0.35, -bot.r * 0.35, 0, -bot.r * 0.35, -bot.r * 0.35, bot.r * 0.6);
      gHighlight.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
      gHighlight.addColorStop(0.7, 'rgba(255, 255, 255, 0.08)');
      gHighlight.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = gHighlight;
      ctx.fill();

      // ==========================================
      // C) BOCHECHAS ROSADAS (Coucou Blush)
      // ==========================================
      if (bot.blush > 0.02) {
        ctx.fillStyle = `rgba(244, 114, 182, ${0.45 * bot.blush})`;
        ctx.beginPath();
        ctx.ellipse(-26, 12, 10, 6, 0, 0, Math.PI * 2);
        ctx.ellipse(26, 12, 10, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // ==========================================
      // D) OLHOS EM CÁPSULA (Eye Tracking + Clipping)
      // ==========================================
      ctx.save();
      // Máscara de corte para os olhos não saírem da face
      ctx.beginPath();
      ctx.arc(0, 0, bot.r - 4, 0, Math.PI * 2);
      ctx.clip();

      const eyeSeparation = 22;
      const eyeOffsetX = bot.look.x * 12 + bot.yaw * 16;
      const eyeOffsetY = bot.look.y * 10 + bot.pitch * 12;

      ctx.fillStyle = '#071626';

      if (bot.mode === 'sleep') {
        // Olhinhos fechados dormindo
        ctx.strokeStyle = '#071626';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(-eyeSeparation + eyeOffsetX, 4 + eyeOffsetY, 10, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.arc(eyeSeparation + eyeOffsetX, 4 + eyeOffsetY, 10, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();
      } else if (bot.mode === 'surprised') {
        // Olhos arregalados redondos com brilho branco
        const rSurprise = 12;
        ctx.beginPath();
        ctx.arc(-eyeSeparation + eyeOffsetX, eyeOffsetY, rSurprise, 0, Math.PI * 2);
        ctx.arc(eyeSeparation + eyeOffsetX, eyeOffsetY, rSurprise, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-eyeSeparation + eyeOffsetX - 3, eyeOffsetY - 3, 3.5, 0, Math.PI * 2);
        ctx.arc(eyeSeparation + eyeOffsetX - 3, eyeOffsetY - 3, 3.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (bot.mode === 'dance') {
        // Olhinhos de felicidade em arco ( ^ _ ^ )
        ctx.strokeStyle = '#042217';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(-eyeSeparation, -2, 10, 1.2 * Math.PI, 1.8 * Math.PI);
        ctx.arc(eyeSeparation, -2, 10, 1.2 * Math.PI, 1.8 * Math.PI);
        ctx.stroke();
      } else if (bot.mode === 'glitch') {
        // Olhos com linhas retas tensas
        ctx.fillStyle = '#3f0707';
        ctx.fillRect(-eyeSeparation - 7 + eyeOffsetX, eyeOffsetY - 2, 16, 4);
        ctx.fillRect(eyeSeparation - 7 + eyeOffsetX, eyeOffsetY - 2, 16, 4);
      } else {
        // Olhos padrão em cápsula (oval vertical com abertura de piscar)
        const eyeW = 8;
        const eyeH = 19 * Math.max(0.08, bot.open);
        
        ctx.beginPath();
        ctx.ellipse(-eyeSeparation + eyeOffsetX, eyeOffsetY, eyeW, eyeH, 0, 0, Math.PI * 2);
        ctx.ellipse(eyeSeparation + eyeOffsetX, eyeOffsetY, eyeW, eyeH, 0, 0, Math.PI * 2);
        ctx.fill();

        // Mini reflexo especular na pupila
        if (bot.open > 0.5) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.beginPath();
          ctx.arc(-eyeSeparation + eyeOffsetX - 2, eyeOffsetY - 5, 2, 0, Math.PI * 2);
          ctx.arc(eyeSeparation + eyeOffsetX - 2, eyeOffsetY - 5, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();

      // ==========================================
      // E) BOCA FALANTE (Coucou Mouth)
      // ==========================================
      if (bot.mouthOpen > 0.05) {
        ctx.fillStyle = '#071626';
        ctx.beginPath();
        ctx.ellipse(0, 18, 7, 3 + bot.mouthOpen * 9, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // ==========================================
      // F) ÓCULOS NERD DE GRAU (Cristalinos)
      // ==========================================
      if (bot.glasses) {
        ctx.save();
        ctx.translate(0, -2);

        // Aros finos
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';

        // Lente Esquerda
        ctx.beginPath();
        ctx.arc(-22, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Lente Direita
        ctx.beginPath();
        ctx.arc(22, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Ponte de metal
        ctx.beginPath();
        ctx.moveTo(-6, -2);
        ctx.quadraticCurveTo(0, -7, 6, -2);
        ctx.stroke();

        // Reflexo de luz na lente
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(-31, -8);
        ctx.lineTo(-19, 8);
        ctx.moveTo(13, -8);
        ctx.lineTo(25, 8);
        ctx.stroke();

        ctx.restore();
      }

      ctx.restore();
    }

    // Loop a 60 FPS
    function loop(t) {
      // Animações específicas de modo contínuo
      if (bot.mode === 'talking') {
        bot.mouthOpen = (Math.sin(t / 90) + 1) / 2;
        bot.handL = { x: -68, y: 10 + Math.sin(t / 200) * 8, rot: 0.5 };
        bot.handR = { x: 68, y: 10 + Math.cos(t / 200) * 8, rot: -0.5 };
        bot.tilt = Math.sin(t / 400) * 0.05;
      } else if (bot.mode === 'hacker') {
        bot.handL = { x: -45, y: 35 + Math.sin(t / 70) * 12, rot: -0.4 };
        bot.handR = { x: 45, y: 35 + Math.cos(t / 70) * 12, rot: 0.4 };
        bot.tilt = 0;
      } else if (bot.mode === 'dance') {
        bot.handL = { x: -62, y: -25 + Math.sin(t / 250) * 16, rot: -0.9 };
        bot.handR = { x: 62, y: -25 + Math.cos(t / 250) * 16, rot: 0.9 };
        bot.tilt = Math.sin(t / 300) * 0.12;
      } else if (bot.mode === 'call') {
        bot.handL = { x: -60, y: -15 + Math.sin(t / 180) * 10, rot: -0.6 };
        bot.handR = { x: 60, y: -15 + Math.sin(t / 180) * 10, rot: 0.6 };
        bot.tilt = 0;
      } else if (bot.mode === 'doubt') {
        bot.handL = { x: 0, y: 0, rot: 0 };
        bot.handR = { x: 48, y: -38 + Math.sin(t / 220) * 4, rot: 0.8 };
        bot.tilt = -0.15;
      } else if (bot.mode === 'surprised') {
        bot.handL = { x: -50, y: 15, rot: 0.6 };
        bot.handR = { x: 50, y: 15, rot: -0.6 };
        bot.tilt = 0;
      } else if (bot.mode === 'nerd') {
        bot.handL = { x: -44, y: 24, rot: 0.7 };
        bot.handR = { x: 0, y: 0, rot: 0 };
        bot.tilt = -0.06;
      } else {
        bot.mouthOpen = 0;
        bot.tilt = spring(bot.tilt, 0, 0.1);
      }

      drawCoucouBot(t);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
