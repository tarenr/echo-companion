<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mochi // Estratégia Nerd 2D Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --en-bg-0: #0a0e17;
      --en-bg-1: #020617;
      --en-accent: #00d4ff;
      --en-accent2: #b829dd;
      --en-accent-soft: #7fe3f5;
      --en-ink: #041622;
    }
    body {
      background-color: var(--en-bg-0);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .canvas-glow {
      filter: drop-shadow(0 14px 28px rgba(0, 212, 255, 0.22));
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen p-3 md:p-6 flex flex-col items-center justify-between font-sans antialiased overflow-x-hidden">

  <!-- Header Estratégia Nerd -->
  <header class="text-center mt-1 w-full max-w-sm">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#00d4ff]/10 border border-[#00d4ff]/40 text-[#00d4ff] text-[11px] font-semibold uppercase tracking-wider mb-1">
      <span class="w-2 h-2 rounded-full bg-[#00d4ff] animate-ping"></span>
      Estratégia Nerd // Mochi 2D
    </div>
    <h1 class="text-lg font-bold tracking-tight text-white">Mascote Oficial 2D</h1>
    <p class="text-xs text-slate-400">Toque no boneco para amassar com som, ou selecione qualquer ação abaixo!</p>
  </header>

  <!-- Palco Central com Canvas -->
  <main class="w-full max-w-sm bg-[#060911]/90 border border-[#00d4ff]/25 rounded-[32px] p-5 shadow-2xl flex flex-col items-center justify-center relative overflow-hidden min-h-[350px] my-2 backdrop-blur-md">
    
    <!-- Satélite / Badge de Estado Flutuante -->
    <div id="status-chip" class="absolute top-4 left-5 px-2.5 py-1 rounded-full bg-[#0c1424] border border-[#00d4ff]/30 text-[10px] font-mono text-[#7fe3f5] flex items-center gap-1.5 shadow-sm">
      <span id="chip-dot" class="w-2 h-2 rounded-full bg-[#00d4ff]"></span>
      <span id="chip-label">idle</span>
    </div>

    <!-- Canvas do Mochi com a Paleta Estratégia Nerd -->
    <div class="canvas-glow relative cursor-pointer active:scale-95 transition-transform duration-75">
      <canvas id="coucouCanvas" width="240" height="240" class="block"></canvas>
    </div>

    <!-- Balão de Fala Dinâmico (Modo Falando) -->
    <div id="speech-bubble" class="mt-2 max-w-xs bg-[#0b172a]/90 border border-[#00d4ff]/40 rounded-2xl p-2.5 text-xs text-[#eafcff] hidden shadow-lg text-center animate-fade-in">
      💬 "<span id="speech-text">Fala Mestre! Estratégia Nerd online e monitorando tudo!</span>"
    </div>

    <!-- Legenda e Feedback -->
    <div class="text-center mt-3 w-full">
      <div class="text-base font-bold text-white tracking-wide" id="action-title">Mochi (Ao Repouso)</div>
      <div class="text-xs text-[#7fe3f5] mt-0.5" id="action-desc">Física elástica 2D com a paleta oficial do Estratégia Nerd</div>
    </div>
  </main>

  <!-- Painel de Ações: Emotes, Estados e Transformações -->
  <footer class="w-full max-w-sm bg-[#090e17]/95 border border-slate-800 rounded-3xl p-3 flex flex-col gap-2 mb-1 backdrop-blur-md">
    
    <!-- Seletor de Categoria -->
    <div class="flex rounded-xl bg-slate-800/80 p-1 border border-slate-700/60 text-xs font-semibold">
      <button id="tab-emotes" onclick="selectTab('emotes')" class="flex-1 py-1.5 rounded-lg bg-[#00d4ff] text-slate-950 font-bold transition shadow-sm">
        🗣️ Fala & Emotes (8)
      </button>
      <button id="tab-states" onclick="selectTab('states')" class="flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition">
        ⚡ Estados (5)
      </button>
      <button id="tab-morphs" onclick="selectTab('morphs')" class="flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition">
        ⚙️ 2D Morphs (3)
      </button>
    </div>

    <!-- GRUPO 1: FALA & EMOTES (8) -->
    <div id="panel-emotes" class="grid grid-cols-2 gap-1.5 max-h-[160px] overflow-y-auto pr-0.5">
      <button onclick="triggerSpeak()" class="col-span-2 px-3 py-2 rounded-xl bg-[#00d4ff]/20 border border-[#00d4ff]/50 text-[#00d4ff] text-xs font-bold flex items-center justify-center gap-1.5 active:scale-95 transition shadow-sm">
        <span>🗣️</span> <span>Modo Falando (Voz & Boca)</span>
      </button>

      <button onclick="triggerEmote('love')" class="px-2 py-2 rounded-xl bg-[#b829dd]/20 border border-[#b829dd]/40 text-[#f0abfc] text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>💖</span> <span>Amor (Corações)</span>
      </button>
      <button onclick="triggerEmote('wink')" class="px-2 py-2 rounded-xl bg-purple-600/20 border border-purple-500/40 text-purple-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>😉</span> <span>Piscadela (Wink)</span>
      </button>
      <button onclick="triggerEmote('proud')" class="px-2 py-2 rounded-xl bg-amber-600/20 border border-amber-500/40 text-amber-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>⭐</span> <span>Orgulhoso (Estrelas)</span>
      </button>
      <button onclick="triggerEmote('happy')" class="px-2 py-2 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>😊</span> <span>Feliz (^ _ ^)</span>
      </button>
      <button onclick="triggerEmote('surprised')" class="px-2 py-2 rounded-xl bg-sky-600/20 border border-sky-500/40 text-sky-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>😲</span> <span>Surpreso (O O)</span>
      </button>
      <button onclick="triggerEmote('annoyed')" class="px-2 py-2 rounded-xl bg-rose-600/20 border border-rose-500/40 text-rose-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>😒</span> <span>Bravo (- _ -)</span>
      </button>
      <button onclick="triggerEmote('yawn')" class="col-span-2 px-2 py-2 rounded-xl bg-slate-700/40 border border-slate-600 text-slate-300 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
        <span>🥱</span> <span>Bocejo (Sono Zzz)</span>
      </button>
    </div>

    <!-- GRUPO 2: ESTADOS NATIVOS COM TINT E BADGES (5) -->
    <div id="panel-states" class="grid grid-cols-2 gap-1.5 hidden max-h-[160px] overflow-y-auto pr-0.5">
      <button onclick="triggerState('idle')" class="px-2 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>⚪</span> <span>Ao Repouso (Idle)</span>
      </button>
      <button onclick="triggerState('working')" class="px-2 py-2 rounded-xl bg-[#00d4ff]/20 border border-[#00d4ff]/40 text-[#7fe3f5] text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>🔵</span> <span>Trabalhando (Badge)</span>
      </button>
      <button onclick="triggerState('thinking')" class="px-2 py-2 rounded-xl bg-[#b829dd]/20 border border-[#b829dd]/40 text-[#f0abfc] text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>🟣</span> <span>Pensando (Badge)</span>
      </button>
      <button onclick="triggerState('approval')" class="px-2 py-2 rounded-xl bg-amber-600/20 border border-amber-500/40 text-amber-200 text-xs font-semibold flex items-center gap-1.5 active:scale-95 transition">
        <span>🟠</span> <span>Aprovação (!)</span>
      </button>
      <button onclick="triggerState('finished')" class="col-span-2 px-2 py-2 rounded-xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-200 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
        <span>🟢</span> <span>Concluído (Giro 360°)</span>
      </button>
    </div>

    <!-- GRUPO 3: 2D MORPHS ATIVOS COM ANIMAÇÃO COMPLETA (3) -->
    <div id="panel-morphs" class="grid grid-cols-2 gap-1.5 hidden max-h-[160px] overflow-y-auto pr-0.5">
      <button onclick="triggerMorph('printer')" class="p-2.5 rounded-xl bg-[#00d4ff]/20 border border-[#00d4ff]/50 text-[#7fe3f5] text-xs font-bold flex flex-col items-center gap-1 active:scale-95 transition">
        <span class="text-xl">🖨️</span>
        <span>Imprimir Relatório</span>
        <span class="text-[9px] font-normal text-slate-300">Bandeja & papel animado</span>
      </button>

      <button onclick="triggerMorph('pc90s')" class="p-2.5 rounded-xl bg-[#b829dd]/20 border border-[#b829dd]/50 text-[#f0abfc] text-xs font-bold flex flex-col items-center gap-1 active:scale-95 transition">
        <span class="text-xl">🖥️</span>
        <span>PC Retrô 90s</span>
        <span class="text-[9px] font-normal text-slate-300">Tela CRT verde & disquete</span>
      </button>

      <button onclick="triggerMorph('glasses')" class="col-span-2 p-2 rounded-xl bg-sky-600/20 border border-sky-500/40 text-sky-200 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
        <span>👓</span>
        <span>Óculos Nerd 2D de Grau</span>
      </button>
    </div>

  </footer>

  <!-- SCRIPT DO MOTOR COMPLETO -->
  <script>
    const NOW = () => performance.now();
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;

    // Curvas elásticas de interpolação
    const E = {
      out: t => 1 - Math.pow(1 - t, 3),
      inOut: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
      back: t => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
      lin: t => t
    };

    const hexRgb = h => {
      h = h.replace('#', '');
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    };
    const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
    const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

    function rr(x, X, Y, W, H, R) {
      R = Math.max(0, Math.min(R, W / 2, H / 2));
      x.beginPath();
      x.moveTo(X + R, Y);
      x.arcTo(X + W, Y, X + W, Y + H, R);
      x.arcTo(X + W, Y + H, X, Y + H, R);
      x.arcTo(X, Y + H, X, Y, R);
      x.arcTo(X, Y, X + W, Y, R);
      x.closePath();
    }
    function heart(x, s) {
      x.beginPath();
      x.moveTo(0, s * 0.38);
      x.bezierCurveTo(-s * 1.05, -s * 0.15, -s * 0.5, -s * 0.95, 0, -s * 0.38);
      x.bezierCurveTo(s * 0.5, -s * 0.95, s * 1.05, -s * 0.15, 0, s * 0.38);
      x.closePath();
    }
    function star(x, ro, ri) {
      x.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 ? ri : ro, a = -Math.PI / 2 + i * Math.PI / 5;
        x.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      x.closePath();
    }

    // ========================================================
    // SINTETIZADOR DE ÁUDIO WEB AUDIO
    // ========================================================
    const Snd = {
      ctx: null, on: true, vol: 0.5,
      init() {
        if (this.ctx) return;
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return;
        const c = this.ctx = new C();
        this.master = c.createGain();
        this.master.gain.value = this.vol;
        this.master.connect(c.destination);
      },
      tone({ f = 440, to = 0, d = 0.2, type = 'sine', g = 0.1, a = 0.006 }) {
        this.init();
        if (!this.ctx) return;
        const c = this.ctx, t = c.currentTime;
        const o = c.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (to) o.frequency.exponentialRampToValueAtTime(to, t + d * 0.9);
        const gn = c.createGain();
        gn.gain.setValueAtTime(0.0001, t);
        gn.gain.exponentialRampToValueAtTime(g, t + a);
        gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(gn);
        gn.connect(this.master);
        o.start(t);
        o.stop(t + d + 0.05);
      },
      play(name) {
        if (name === 'slap') {
          this.tone({ f: 280, to: 120, d: 0.14, type: 'triangle', g: 0.15 });
        } else if (name === 'pop') {
          this.tone({ f: 450, to: 820, d: 0.09, type: 'sine', g: 0.12 });
        } else if (name === 'love') {
          this.tone({ f: 523, to: 659, d: 0.25, type: 'sine', g: 0.1 });
        } else if (name === 'proud') {
          this.tone({ f: 659, to: 880, d: 0.22, type: 'sine', g: 0.12 });
        } else if (name === 'wink') {
          this.tone({ f: 780, to: 600, d: 0.12, type: 'sine', g: 0.09 });
        } else if (name === 'yawn') {
          this.tone({ f: 380, to: 220, d: 0.5, type: 'sine', g: 0.08 });
        } else if (name === 'finish') {
          this.tone({ f: 523, to: 1046, d: 0.35, type: 'triangle', g: 0.15 });
        } else if (name === 'speech') {
          // Bips de sintetizador fofo falando
          this.tone({ f: 350 + Math.random() * 250, to: 420 + Math.random() * 200, d: 0.08, type: 'sine', g: 0.08 });
        } else if (name === 'print') {
          this.tone({ f: 220, to: 180, d: 0.12, type: 'square', g: 0.06 });
        }
      }
    };

    // ========================================================
    // PALETA OFICIAL DO ESTRATÉGIA NERD
    // ========================================================
    const MOCHI_SPEC = {
      name: 'Mochi EN',
      shape: 'mochi',
      eye: { w: 0.24, h: 0.26, sp: 0.36, p: -0.08 },
      base: ['#eafcff', '#7fe3f5'], // Cyan suave oficial EN
      ink: '#041622',               // Ink azul escuro
      blush: '#b829dd'              // Magenta neon oficial EN
    };

    const STATES = {
      idle: { label: 'Ao repouso', col: '#00d4ff', tint: 0, eye: 'pill', badge: null },
      working: { label: 'Trabalhando', col: '#00d4ff', tint: 0.72, eye: 'pill', badge: ['dots', '#00d4ff'] },
      finished: { label: 'Concluído', col: '#34D399', tint: 0.4, eye: 'happy', badge: ['dot', '#34D399'] },
      error: { label: 'Erro', col: '#F4505E', tint: 0.78, eye: 'flat', badge: ['dot', '#F4505E'] },
      dizzy: { label: 'Tonto', col: '#b829dd', tint: 0.7, eye: 'spiral', badge: null },
      thinking: { label: 'Pensando', col: '#b829dd', tint: 0.72, eye: 'pill', badge: ['dots', '#b829dd'] },
      approval: { label: 'Aguardando', col: '#F5A524', tint: 0.78, eye: 'wide', badge: ['bang', '#F5A524'] }
    };

    const EMOTES = {
      love: { label: 'Amor', eye: 'heart', snd: 'love', c: '#b829dd' },
      surprised: { label: 'Surpreso', eye: 'dot', snd: 'pop', c: '#00d4ff' },
      proud: { label: 'Orgulhoso', eye: 'star', snd: 'proud', c: '#F7B32B' },
      wink: { label: 'Piscadela', eye: 'wink', snd: 'wink', c: '#7fe3f5' },
      yawn: { label: 'Bocejo', eye: 'tired', snd: 'yawn', c: '#94A3B8' },
      happy: { eye: 'happy' },
      annoyed: { eye: 'line' }
    };

    // ========================================================
    // CLASSE BOT OFICIAL COM SUPORTE A FALA E MORPHS
    // ========================================================
    class Bot {
      constructor(canvas) {
        this.c = canvas;
        this.x = canvas.getContext('2d');
        this.s = {
          yaw: 0, pitch: 0, roll: 0, tilt: 0,
          open: 1, sx: 1, sy: 1, oy: 0, ox: 0,
          tint: 0, morph: 0, hands: 0, blush: 0,
          es: 1, badgeS: 0,
          paperY: 0,
          glasses: 0,
          mouthOpen: 0,
          speaking: false,
          customMode: 'none'
        };
        this.tg = { ...this.s };
        this.tw = [];
        this.lock = {};
        this.col = [0, 212, 255];
        this.colT = [0, 212, 255];
        this.state = 'idle';
        this.cfg = STATES.idle;
        this.eyeOv = null;
        this.ovUntil = 0;
        this.badge = null;
        this.badgeCol = '#00d4ff';
        this._bk = 'none';
        this._bt = 0;
        this.parts = [];
        this.nextBlink = NOW() + 2000 + Math.random() * 2000;
        this.look = { x: 0, y: 0 };
        this.t0 = NOW();
        this.last = NOW();
        
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = 240 * dpr;
        canvas.height = 240 * dpr;
        canvas.style.width = '240px';
        canvas.style.height = '240px';
        this.x.scale(dpr, dpr);
      }

      anim(p, keys, after) {
        this.tw = this.tw.filter(t => t.p !== p);
        this.tw.push({ p, keys, i: 0, from: this.s[p], t0: NOW(), after });
        this.lock[p] = 1;
      }

      setBadge(b) {
        const key = b ? b.join() : 'none';
        if (key === this._bk) return;
        this._bk = key;
        const tok = ++this._bt;
        this.anim('badgeS', [[0, 80, E.inOut]]);
        setTimeout(() => {
          if (tok !== this._bt) return;
          this.badge = b ? b[0] : null;
          this.badgeCol = b ? b[1] : null;
          if (b) this.anim('badgeS', [[1, 260, E.back]]);
        }, 90);
      }

      setState(n) {
        if (!STATES[n]) return;
        this.state = n;
        const c = this.cfg = STATES[n];
        this.colT = hexRgb(c.col);
        this.tg.tint = c.tint;
        this.tg.tilt = c.tilt || 0;
        this.setBadge(c.badge);

        if (n === 'finished') {
          this.roll(850, 1);
          setTimeout(() => this.emit('spark', 6), 450);
          Snd.play('finish');
        } else if (n === 'error') {
          this.anim('ox', [[0.08, 50, E.out], [-0.08, 70, E.inOut], [0.05, 70, E.inOut], [0, 90, E.out]]);
          Snd.play('slap');
        } else if (n === 'approval') {
          this.anim('oy', [[-0.2, 140, E.out], [0, 280, E.back]]);
          Snd.play('pop');
        } else if (n === 'thinking') {
          this.anim('tilt', [[-0.12, 220, E.out]]);
          Snd.play('love');
        } else if (n === 'working') {
          this.anim('sy', [[0.95, 120, E.out], [1, 140, E.inOut]]);
          Snd.play('proud');
        } else {
          this.blink();
        }
      }

      blink() {
        if (this.lock.open) return;
        this.anim('open', [[0.05, 60, E.inOut], [1, 120, E.out]]);
      }

      squash() {
        Snd.play('slap');
        this.anim('sy', [[0.78, 70, E.out], [1.12, 130, E.out], [1, 160, E.inOut]]);
        this.anim('sx', [[1.18, 70, E.out], [0.94, 130, E.out], [1, 160, E.inOut]]);
      }

      roll(d = 900, turns = 1) {
        this.s.roll = 0;
        this.anim('roll', [[Math.PI * 2 * turns, d, E.inOut]], () => {
          this.s.roll = 0;
          this.tg.roll = 0;
        });
      }

      emote(n, d = 1800) {
        const em = EMOTES[n];
        if (!em) return;
        this.eyeOv = em.eye;
        this.ovUntil = NOW() + d;

        if (n === 'love') {
          this.anim('blush', [[1, 300, E.out], [1, d - 600, E.lin], [0, 300, E.inOut]]);
          this.emit('heart', 4);
          this.anim('oy', [[-0.1, 160, E.out], [0, 300, E.back]]);
        } else if (n === 'surprised') {
          this.anim('oy', [[-0.2, 140, E.out], [0, 350, E.back]]);
          this.anim('es', [[1.25, 120, E.out], [1, 400, E.inOut]]);
        } else if (n === 'proud') {
          this.emit('star', 5);
          this.anim('tilt', [[-0.12, 220, E.out], [-0.12, d - 500, E.lin], [0, 260, E.inOut]]);
        } else if (n === 'wink') {
          this.anim('tilt', [[0.12, 160, E.out], [0.12, d - 400, E.lin], [0, 240, E.inOut]]);
        } else if (n === 'yawn') {
          this.anim('sy', [[1.1, 400, E.inOut], [1, 400, E.inOut]]);
          setTimeout(() => { this.eyeOv = 'closed'; this.emit('z', 2); }, 500);
        } else if (n === 'happy') {
          this.anim('blush', [[0.6, 200, E.out], [0, 600, E.inOut]]);
        }
        if (em.snd) Snd.play(em.snd);
      }

      emit(type, n) {
        for (let i = 0; i < n; i++) {
          this.parts.push({
            type,
            x: (Math.random() - 0.5) * 0.9 + (type === 'z' ? 0.5 : 0),
            y: -0.7 - Math.random() * 0.2,
            vx: (Math.random() - 0.5) * 0.3 + (type === 'z' ? 0.15 : 0),
            vy: -(0.4 + Math.random() * 0.3),
            age: -i * 0.12,
            life: 1.2 + Math.random() * 0.4,
            rot: Math.random() * 6,
            sz: 0.14 + Math.random() * 0.08
          });
        }
      }

      update() {
        const n = NOW(), dt = Math.min(0.05, (n - this.last) / 1000);
        this.last = n;
        const s = this.s, tg = this.tg, t = (n - this.t0) / 1000;

        for (const tw of [...this.tw]) {
          const k = tw.keys[tw.i];
          const p = clamp((n - tw.t0) / k[1], 0, 1);
          s[tw.p] = tw.from + (k[0] - tw.from) * k[2](p);
          if (p >= 1) {
            tw.from = k[0];
            tw.i++;
            tw.t0 = n;
            if (tw.i >= tw.keys.length) {
              this.tw.splice(this.tw.indexOf(tw), 1);
              delete this.lock[tw.p];
              this.tg[tw.p] = tw.keys[tw.keys.length - 1][0];
              if (tw.after) tw.after();
            }
          }
        }

        // Clamp suave dos olhos (proporções agradáveis e seguras)
        tg.yaw = clamp(this.look.x * 0.42, -0.38, 0.38);
        tg.pitch = clamp(this.look.y * 0.26, -0.22, 0.14);
        tg.sy = 1 + Math.sin(t * 1.8) * 0.025;
        tg.sx = 1 - Math.sin(t * 1.8) * 0.015;

        // Se estiver falando, articula boca e cabeça
        if (s.speaking) {
          s.mouthOpen = (Math.sin(t * 15) + 1) / 2;
          tg.tilt = Math.sin(t * 6) * 0.06;
          s.hands = 1;
        } else {
          s.mouthOpen = 0;
          if (s.customMode === 'none') s.hands = 0;
        }

        const kLook = 1 - Math.pow(0.002, dt), kGen = 1 - Math.pow(0.0008, dt);
        for (const k in tg) {
          if (this.lock[k]) continue;
          s[k] += (tg[k] - s[k]) * ((k === 'yaw' || k === 'pitch') ? kLook : kGen);
        }

        this.col = mix(this.col, this.colT, 1 - Math.pow(0.002, dt));

        if (n > this.nextBlink) {
          this.blink();
          this.nextBlink = n + 2200 + Math.random() * 3200;
        }
        if (this.eyeOv && n > this.ovUntil) this.eyeOv = null;

        for (const p of this.parts) p.age += dt;
        this.parts = this.parts.filter(p => p.age < p.life);
      }

      draw() {
        const x = this.x, W = 240, H = 240, s = this.s, P = MOCHI_SPEC;
        x.clearRect(0, 0, W, H);

        const R = W * 0.3;
        let rx = R * 1.14, ry = R * 0.88;
        const cx = W / 2 + s.ox * R, cy = H / 2 + s.oy * R + R * 0.06;

        x.save();
        x.translate(cx, cy);
        x.rotate(s.tilt);
        x.scale(s.sx, s.sy);

        const path = new Path2D(), m = s.morph;

        // ==========================================
        // 1. CORPO 2D (SUPERELIPSE OU RETÂNGULO 2D)
        // ==========================================
        if (m < 0.01) {
          for (let i = 0; i <= 72; i++) {
            const a = i / 72 * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
            const px = rx * Math.sign(ca) * Math.pow(Math.abs(ca), 2 / 2.7);
            const py = ry * Math.sign(sa) * Math.pow(Math.abs(sa), 2 / 2.7);
            i ? path.lineTo(px, py) : path.moveTo(px, py);
          }
          path.closePath();
        } else {
          // Morfagem para retângulo 2D arredondado
          const w = lerp(rx, R * 1.15, m), h = lerp(ry, R * 0.88, m), r = lerp(Math.min(rx, ry), R * 0.32, m);
          path.moveTo(-w + r, -h);
          path.arcTo(w, -h, w, h, r);
          path.arcTo(w, h, -w, h, r);
          path.arcTo(-w, h, -w, -h, r);
          path.arcTo(-w, -h, w, -h, r);
          path.closePath();
        }

        // Cor Base Oficial Estratégia Nerd
        let c0 = hexRgb(P.base[0]), c1 = hexRgb(P.base[1]);
        if (s.customMode === 'pc90s') {
          c0 = [228, 222, 208]; c1 = [200, 192, 174]; // Bege retrô
        } else if (s.customMode === 'printer') {
          c0 = [14, 22, 36]; c1 = [6, 11, 20]; // Chassi escuro high-tech com cyan
        }

        const g = x.createLinearGradient(0, -ry, 0, ry);
        g.addColorStop(0, rgba(c0, 1));
        g.addColorStop(1, rgba(c1, 1));
        x.fillStyle = g;
        x.fill(path);

        // ==========================================
        // 2. ILUMINAÇÃO DE ESTADO (COUCOU TINT WASH)
        // ==========================================
        if (s.tint > 0.01) {
          const tg2 = x.createLinearGradient(0, ry, 0, -ry * 0.3);
          tg2.addColorStop(0, rgba(this.col, 0.88 * s.tint));
          tg2.addColorStop(1, rgba(this.col, 0));
          x.fillStyle = tg2;
          x.fill(path);
        }

        // Borda sutil cyan Estratégia Nerd
        x.strokeStyle = s.customMode === 'printer' ? '#00d4ff' : 'rgba(0, 212, 255, 0.15)';
        x.lineWidth = s.customMode === 'printer' ? 2 : 1.5;
        x.stroke(path);

        // ==========================================
        // 3. BOCHECHAS MAGENTA NEON (ESTRATÉGIA NERD)
        // ==========================================
        const bl = Math.max(s.blush, 0.32) * (1 - m);
        if (bl > 0.01) {
          x.save();
          x.clip(path);
          const yo = Math.sin(s.yaw) * rx * 0.7;
          x.fillStyle = `rgba(184, 41, 221, ${0.45 * bl})`; // Magenta #b829dd
          for (const sd of [-1, 1]) {
            x.beginPath();
            x.ellipse(sd * rx * 0.52 + yo, ry * 0.18, R * 0.16, R * 0.09, 0, 0, Math.PI * 2);
            x.fill();
          }
          x.restore();
        }

        // ==========================================
        // 4. MÃOS GESTICULANDO (COUCOU HANDS)
        // ==========================================
        if (s.hands > 0.05) {
          const hr = R * 0.18 * s.hands;
          const t = NOW() / 1000;
          x.fillStyle = '#7fe3f5';
          x.strokeStyle = '#00d4ff';
          x.lineWidth = 2;

          for (const sd of [-1, 1]) {
            const hx = sd * rx * 1.25 * s.sx;
            const hy = ry * 0.35 + Math.sin(t * 8 + sd) * 6;
            x.beginPath();
            x.arc(hx, hy, hr, 0, Math.PI * 2);
            x.fill();
            x.stroke();
          }
        }

        // ==========================================
        // 5. BOCA FALANTE DINÂMICA
        // ==========================================
        if (s.mouthOpen > 0.05) {
          x.fillStyle = P.ink;
          x.beginPath();
          x.ellipse(0, ry * 0.28, 6, 2 + s.mouthOpen * 7, 0, 0, Math.PI * 2);
          x.fill();
        }

        // ==========================================
        // 6. MORPH 2D: IMPRESSORA (ALIMENTADOR & PAPEL)
        // ==========================================
        if (s.customMode === 'printer') {
          x.save();
          // Bandeja de alimentação superior com folha branca
          x.fillStyle = '#1e293b';
          rr(x, -R * 0.55, -ry - R * 0.28, R * 1.1, R * 0.35, 4);
          x.fill();
          x.fillStyle = '#ffffff';
          rr(x, -R * 0.45, -ry - R * 0.25, R * 0.9, R * 0.26, 2);
          x.fill();

          // Visor LCD superior da impressora
          x.fillStyle = '#061622';
          rr(x, -R * 0.65, -R * 0.5, R * 1.3, R * 0.35, 4);
          x.fill();
          x.fillStyle = '#00d4ff';
          x.font = '700 8px monospace';
          x.textAlign = 'center';
          x.fillText('PRINTING // 100%', 0, -R * 0.28);

          // Fenda mecânica frontal de saída
          x.fillStyle = '#020617';
          rr(x, -R * 0.75, R * 0.05, R * 1.5, 9, 4.5);
          x.fill();
          x.strokeStyle = '#00d4ff';
          x.lineWidth = 1;
          x.stroke();

          // Folha impressa saindo da fenda
          if (s.paperY > 0.02) {
            const pw = R * 1.2, ph = R * 1.05 * s.paperY;
            x.fillStyle = '#ffffff';
            x.shadowColor = 'rgba(0, 212, 255, 0.3)';
            x.shadowBlur = 10;
            rr(x, -pw / 2, R * 0.1, pw, ph, 4);
            x.fill();
            x.shadowBlur = 0;

            // Cabeçalho Estratégia Nerd no papel impresso
            x.fillStyle = '#00d4ff';
            x.fillRect(-pw / 2 + 8, R * 0.1 + 6, pw - 16, 3);
            x.fillStyle = '#0f172a';
            x.font = 'bold 7px monospace';
            x.textAlign = 'left';
            x.fillText('ESTRATEGIA NERD', -pw / 2 + 8, R * 0.1 + 17);
            x.fillStyle = '#10b981';
            x.fillText('✓ PLANO EXECUTADO', -pw / 2 + 8, R * 0.1 + 27);
          }
          x.restore();
        }

        // ==========================================
        // 7. MORPH 2D: PC RETRÔ 90s (Macintosh CRT)
        // ==========================================
        if (s.customMode === 'pc90s') {
          x.save();
          // Tela CRT verde
          x.fillStyle = '#04160d';
          rr(x, -R * 0.82, -R * 0.72, R * 1.64, R * 0.94, 6);
          x.fill();

          // Texto CRT verde
          x.fillStyle = '#10b981';
          x.font = '800 13px monospace';
          x.textAlign = 'center';
          x.fillText('( ^ _ ^ )', 0, -R * 0.35);
          x.font = '700 7.5px monospace';
          x.fillText('> ESTRATEGIA NERD', 0, -R * 0.12);
          x.fillText('> BOOT OK // 1994', 0, R * 0.06);

          // Fenda de disquete integrada
          x.fillStyle = '#1e293b';
          rr(x, -R * 0.6, R * 0.44, R * 1.2, 7, 3);
          x.fill();
          // Disquete
          x.fillStyle = '#00d4ff';
          rr(x, -R * 0.35, R * 0.44, R * 0.7, 5, 1.5);
          x.fill();
          // LED
          x.fillStyle = '#10b981';
          x.beginPath(); x.arc(R * 0.7, R * 0.47, 3, 0, Math.PI * 2); x.fill();
          x.restore();
        }

        // ==========================================
        // 8. OLHOS 2D REDONDOS ORIGINAIS DO COUCOU
        // ==========================================
        if (s.customMode !== 'pc90s' && s.customMode !== 'printer') {
          x.save();
          x.clip(path);
          x.fillStyle = P.ink;
          x.strokeStyle = P.ink;

          const shape = this.eyeOv || this.cfg.eye;
          for (const sd of [-1, 1]) {
            const yaw = sd * P.eye.sp + s.yaw;
            let pitch = P.eye.p + s.pitch + s.roll;
            pitch = ((pitch + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;

            const cp = Math.cos(pitch);
            if (Math.cos(yaw) * cp < 0.04) continue;

            let px = Math.sin(yaw) * cp * rx, py = -Math.sin(pitch) * ry;
            if (m > 0) py += ry * 0.14 * m;

            const fx = lerp(Math.max(0.18, Math.cos(yaw)), 1, m * 0.7);
            const fy = lerp(Math.max(0.18, cp), 1, m * 0.7);

            x.save();
            x.translate(px, py);
            x.scale(fx, fy);
            this.eye(shape, R * P.eye.w * s.es, R * P.eye.h * s.es, s.open, sd, P);
            x.restore();
          }
          x.restore();
        }

        // ==========================================
        // 9. ÓCULOS NERD 2D (CIRCULARES E CRISTALINOS)
        // ==========================================
        if (s.glasses > 0.05) {
          x.save();
          x.translate(0, -R * 0.06);
          x.scale(s.glasses, s.glasses);
          x.strokeStyle = '#00d4ff'; // Cyan Estratégia Nerd
          x.lineWidth = 3;
          x.fillStyle = 'rgba(0, 212, 255, 0.12)';

          for (const sd of [-1, 1]) {
            x.beginPath();
            x.arc(sd * R * 0.37, 0, R * 0.23, 0, Math.PI * 2);
            x.fill();
            x.stroke();
          }
          // Ponte
          x.beginPath();
          x.moveTo(-R * 0.14, -R * 0.02);
          x.quadraticCurveTo(0, -R * 0.1, R * 0.14, -R * 0.02);
          x.stroke();
          // Reflexos
          x.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          x.lineWidth = 1.8;
          x.beginPath();
          x.moveTo(-R * 0.47, -R * 0.1); x.lineTo(-R * 0.31, R * 0.1);
          x.moveTo(R * 0.27, -R * 0.1); x.lineTo(R * 0.43, R * 0.1);
          x.stroke();
          x.restore();
        }

        // ==========================================
        // 10. BADGES NA TESTA NATIVOS DO COUCOU
        // ==========================================
        if (this.badge && s.badgeS > 0.01) {
          const bs = s.badgeS;
          const bx = -rx * 0.72 * s.sx, by = -ry * 0.72 * s.sy;
          x.save();
          x.translate(bx, by);
          x.scale(bs, bs);
          const bcol = this.badgeCol;

          if (this.badge === 'dots') {
            const w = R * 0.74, h = R * 0.42;
            x.fillStyle = '#041622';
            rr(x, -w / 2 - R * 0.06, -h / 2 - R * 0.06, w + R * 0.12, h + R * 0.12, (h + R * 0.12) / 2);
            x.fill();
            x.fillStyle = bcol;
            rr(x, -w / 2, -h / 2, w, h, h/2);
            x.fill();

            const tt = NOW() / 1000;
            for (let i = 0; i < 3; i++) {
              const ph = ((tt * 2.4 - i * 0.22) % 1 + 1) % 1;
              const r = R * 0.058 * (1 + 0.4 * Math.max(0, Math.sin(ph * Math.PI * 2)));
              x.fillStyle = '#ffffff';
              x.beginPath();
              x.arc((i - 1) * R * 0.19, 0, r, 0, Math.PI * 2);
              x.fill();
            }
          } else if (this.badge === 'bang' || this.badge === 'q') {
            x.fillStyle = '#041622';
            x.beginPath(); x.arc(0, 0, R * 0.28, 0, Math.PI * 2); x.fill();
            x.fillStyle = bcol;
            x.beginPath(); x.arc(0, 0, R * 0.22, 0, Math.PI * 2); x.fill();
            x.fillStyle = '#fff';
            x.font = `800 ${R * 0.3}px -apple-system, sans-serif`;
            x.textAlign = 'center';
            x.textBaseline = 'middle';
            x.fillText(this.badge === 'bang' ? '!' : '?', 0, R * 0.02);
          } else {
            x.fillStyle = '#041622';
            x.beginPath(); x.arc(0, 0, R * 0.19, 0, Math.PI * 2); x.fill();
            x.fillStyle = bcol;
            x.beginPath(); x.arc(0, 0, R * 0.13, 0, Math.PI * 2); x.fill();
          }
          x.restore();
        }

        x.restore();

        // ==========================================
        // 11. PARTÍCULAS ORIGINAIS (CORAÇÃO, ESTRELAS, ZZZ)
        // ==========================================
        for (const p of this.parts) {
          if (p.age < 0) continue;
          const k = p.age / p.life, a = k < 0.2 ? k / 0.2 : 1 - (k - 0.2) / 0.8;
          const px = cx + (p.x + p.vx * p.age) * R * 1.3, py = cy + (p.y + p.vy * p.age) * R * 1.3;
          const sz = R * p.sz * (1 + k * 0.4);

          x.save();
          x.translate(px, py);
          x.globalAlpha = clamp(a, 0, 1);
          if (p.type === 'heart') {
            x.fillStyle = '#b829dd'; // Magenta neon
            x.rotate(Math.sin(p.age * 6) * 0.3);
            heart(x, sz);
            x.fill();
          } else if (p.type === 'star') {
            x.fillStyle = '#00d4ff'; // Cyan neon
            x.rotate(p.rot + p.age * 2);
            star(x, sz, sz * 0.45);
            x.fill();
          } else if (p.type === 'spark') {
            x.fillStyle = '#34d399';
            x.rotate(p.rot);
            star(x, sz * 0.8, sz * 0.18);
            x.fill();
          } else if (p.type === 'z') {
            x.fillStyle = '#7fe3f5';
            x.font = `700 ${sz * 1.9}px -apple-system, sans-serif`;
            x.fillText('z', 0, 0);
          }
          x.restore();
        }
      }

      eye(shape, w, h, open, sd, P) {
        const x = this.x, t = NOW() / 1000;
        switch (shape) {
          case 'wide': w *= 1.15; h *= 1.15; /* fallthrough */
          case 'pill': {
            const hh = Math.max(h * open, w * 0.3);
            rr(x, -w / 2, -hh / 2, w, hh, Math.min(w / 2, hh / 2));
            x.fill();
            break;
          }
          case 'dot':
            x.beginPath();
            x.arc(0, 0, w * 0.48, 0, Math.PI * 2);
            x.fill();
            break;
          case 'line':
            x.rotate(-sd * 0.2);
            rr(x, -w * 0.78, -w * 0.21, w * 1.56, w * 0.42, w * 0.21);
            x.fill();
            break;
          case 'flat':
            rr(x, -w * 0.72, -w * 0.2, w * 1.44, w * 0.4, w * 0.2);
            x.fill();
            break;
          case 'happy':
            x.lineWidth = w * 0.46;
            x.lineCap = 'round';
            x.beginPath();
            x.arc(0, h * 0.16, w * 0.82, Math.PI * 1.12, Math.PI * 1.88);
            x.stroke();
            break;
          case 'closed':
            x.lineWidth = w * 0.36;
            x.lineCap = 'round';
            x.beginPath();
            x.arc(0, -h * 0.08, w * 0.78, Math.PI * 0.15, Math.PI * 0.85);
            x.stroke();
            break;
          case 'spiral':
            x.lineWidth = w * 0.22;
            x.lineCap = 'round';
            x.beginPath();
            for (let a = 0; a < 4.4 * Math.PI; a += 0.2) {
              const r = w * 0.06 + a * w * 0.058, aa = a + t * 9 * sd;
              const px = Math.cos(aa) * r, py = Math.sin(aa) * r;
              a ? x.lineTo(px, py) : x.moveTo(px, py);
            }
            x.stroke();
            break;
          case 'heart':
            x.fillStyle = '#b829dd';
            heart(x, w * 1.2);
            x.fill();
            break;
          case 'star':
            x.fillStyle = '#00d4ff';
            x.rotate(t * 1.5 * sd);
            star(x, w * 1.05, w * 0.46);
            x.fill();
            break;
          case 'tired':
            rr(x, -w / 2, -h * 0.02, w, h * 0.38, w / 2);
            x.fill();
            break;
          case 'wink':
            if (sd < 0) {
              rr(x, -w / 2, -h / 2, w, h, w / 2);
              x.fill();
            } else {
              x.lineWidth = w * 0.5;
              x.lineCap = 'round';
              x.beginPath();
              x.arc(0, h * 0.18, w * 0.82, Math.PI * 1.12, Math.PI * 1.88);
              x.stroke();
            }
            break;
          default:
            rr(x, -w / 2, -h / 2, w, h, w / 2);
            x.fill();
        }
      }
    }

    // ========================================================
    // INICIALIZAÇÃO DA INSTÂNCIA E INTERAÇÕES
    // ========================================================
    const canvas = document.getElementById('coucouCanvas');
    const mochi = new Bot(canvas);

    const titleEl = document.getElementById('action-title');
    const descEl = document.getElementById('action-desc');
    const chipDot = document.getElementById('chip-dot');
    const chipLabel = document.getElementById('chip-label');
    const speechBubble = document.getElementById('speech-bubble');
    const speechText = document.getElementById('speech-text');

    // Toque / Slap com som e elasticidade
    canvas.addEventListener('pointerdown', () => {
      mochi.squash();
    });

    // Eye Tracking tangencial
    function trackMove(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - (rect.left + rect.width / 2);
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - (rect.top + rect.height / 2);
      mochi.look.x = Math.tanh(x / 120);
      mochi.look.y = Math.tanh(y / 100);
    }
    window.addEventListener('pointermove', trackMove);
    window.addEventListener('touchmove', trackMove);

    // Loop de renderização 60 FPS
    function tick() {
      mochi.update();
      mochi.draw();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // ========================================================
    // CONTROLES DE INTERFACE
    // ========================================================
    function selectTab(tab) {
      document.getElementById('panel-emotes').classList.toggle('hidden', tab !== 'emotes');
      document.getElementById('panel-states').classList.toggle('hidden', tab !== 'states');
      document.getElementById('panel-morphs').classList.toggle('hidden', tab !== 'morphs');

      document.getElementById('tab-emotes').className = tab === 'emotes' ? 'flex-1 py-1.5 rounded-lg bg-[#00d4ff] text-slate-950 font-bold transition shadow-sm' : 'flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
      document.getElementById('tab-states').className = tab === 'states' ? 'flex-1 py-1.5 rounded-lg bg-[#00d4ff] text-slate-950 font-bold transition shadow-sm' : 'flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
      document.getElementById('tab-morphs').className = tab === 'morphs' ? 'flex-1 py-1.5 rounded-lg bg-[#00d4ff] text-slate-950 font-bold transition shadow-sm' : 'flex-1 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
    }

    function resetMochiState() {
      mochi.s.speaking = false;
      speechBubble.classList.add('hidden');
      mochi.s.customMode = 'none';
      mochi.anim('morph', [[0, 260, E.out]]);
      mochi.anim('glasses', [[0, 200, E.out]]);
      mochi.s.paperY = 0;
    }

    let speechTimer = null;
    function triggerSpeak() {
      resetMochiState();
      mochi.s.speaking = true;
      speechBubble.classList.remove('hidden');
      speechText.textContent = "Fala Mestre! Estratégia Nerd online e monitorando tudo!";
      
      chipDot.className = 'w-2 h-2 rounded-full bg-[#00d4ff]';
      chipLabel.textContent = 'speaking';
      titleEl.textContent = '🗣️ Modo Falando (Voz & Boca)';
      descEl.textContent = 'Boca articulada com cadência de fala e gesticulação de mãos';

      // Dispara bips de sintetizador fofo
      clearInterval(speechTimer);
      let count = 0;
      speechTimer = setInterval(() => {
        Snd.play('speech');
        count++;
        if (count >= 16) {
          clearInterval(speechTimer);
          mochi.s.speaking = false;
        }
      }, 160);
    }

    function triggerEmote(name) {
      resetMochiState();
      mochi.emote(name, 1900);
      chipDot.className = 'w-2 h-2 rounded-full bg-[#b829dd]';
      chipLabel.textContent = name;
      titleEl.textContent = `Emote: ${EMOTES[name]?.label || name}`;
      descEl.textContent = 'Expressão 2D vetorial com paleta Estratégia Nerd';
    }

    function triggerState(name) {
      resetMochiState();
      mochi.setState(name);
      chipDot.className = `w-2 h-2 rounded-full ${name === 'finished' ? 'bg-emerald-400' : name === 'working' ? 'bg-[#00d4ff]' : name === 'thinking' ? 'bg-[#b829dd]' : name === 'approval' ? 'bg-amber-400' : 'bg-slate-400'}`;
      chipLabel.textContent = name;
      titleEl.textContent = `Estado: ${STATES[name]?.label || name}`;
      descEl.textContent = 'Mochi com badge na cabeça e iluminação ativa';
    }

    function triggerMorph(type) {
      resetMochiState();
      if (type === 'glasses') {
        mochi.s.customMode = 'none';
        mochi.anim('morph', [[0, 250, E.out]]);
        mochi.anim('glasses', [[1, 350, E.back]]);
        Snd.play('pop');
        titleEl.textContent = '👓 Óculos Nerd 2D de Grau';
        descEl.textContent = 'Armação circular cyan cristalina sobre os olhos';
        chipLabel.textContent = 'nerd';
      } else if (type === 'printer') {
        mochi.s.customMode = 'printer';
        mochi.anim('glasses', [[0, 150, E.out]]);
        mochi.anim('morph', [[1, 400, E.back]]);
        mochi.s.paperY = 0;
        Snd.play('print');
        
        // Ejeção ativa do papel com som
        setTimeout(() => {
          mochi.anim('paperY', [[1, 1200, E.out]]);
          Snd.play('finish');
        }, 320);
        titleEl.textContent = '🖨️ Impressora 2D Estratégia Nerd';
        descEl.textContent = 'Chassi cyan escuro, fenda mecânica e relatório impresso';
        chipLabel.textContent = 'printer';
      } else if (type === 'pc90s') {
        mochi.s.customMode = 'pc90s';
        mochi.anim('glasses', [[0, 150, E.out]]);
        mochi.anim('morph', [[1, 400, E.back]]);
        Snd.play('pop');
        setTimeout(() => Snd.play('proud'), 250);
        titleEl.textContent = '🖥️ PC Retrô 90s // Macintosh';
        descEl.textContent = 'Monitor clássico com tela CRT verde e disquete cyan';
        chipLabel.textContent = 'pc-90s';
      }
    }
  </script>
</body>
</html>
