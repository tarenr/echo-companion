<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Robô do Echo</title>
  <meta name="theme-color" content="#020617">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="robo.css?v=2.1">
</head>
<body data-personagem="echo">
  <!-- Página de testes do robô do Echo (a da Luna é robo-luna.html) -->
  <main class="robo-screen">
    <header class="robo-top">
      <span class="robo-title">ROBÔ // TESTES</span>
      <span class="robo-status" id="robo-status">Repouso</span>
    </header>

    <section class="robo-stage" id="robo-stage">
      <canvas id="robo-canvas" width="280" height="280" aria-label="Robô do Echo"></canvas>
    </section>

    <!-- Grupos de botões montados pelo robo.js -->
    <section class="robo-controls" id="robo-controls" aria-label="Animações"></section>
  </main>

  <script src="robo-roupas.js?v=1.3"></script>
  <script src="robo-roupas-echo.js?v=1.10"></script>
  <script src="robo-motor.js?v=1.4"></script>
  <script src="robo.js?v=3.4"></script>
</body>
</html>
