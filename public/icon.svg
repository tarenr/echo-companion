<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background OLED Escuro -->
  <rect width="512" height="512" rx="100" fill="#030712"/>
  
  <!-- Brilho Ambiente Central -->
  <circle cx="256" cy="256" r="220" fill="url(#bg-glow)"/>

  <!-- Moldura Arredondada Fina Estilo Cyberpunk -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Mascote Kaomoji Centralizado: ( ^ _ ^ ) -->
  <g filter="url(#neon-glow)" fill="#00e5ff" font-family="'JetBrains Mono', 'Consolas', 'Segoe UI', monospace">
    <!-- Braço Esquerdo -->
    <text x="75" y="248" font-size="64" font-weight="900" text-anchor="middle" fill="#00e5ff" opacity="0.8">\</text>

    <!-- Parêntese Esquerdo Alto -->
    <text x="135" y="295" font-size="160" font-weight="300" text-anchor="middle">(</text>

    <!-- Olho Esquerdo -->
    <text x="205" y="225" font-size="82" font-weight="900" text-anchor="middle">^</text>

    <!-- Boca Central -->
    <text x="256" y="295" font-size="95" font-weight="900" text-anchor="middle">_</text>

    <!-- Olho Direito -->
    <text x="307" y="225" font-size="82" font-weight="900" text-anchor="middle">^</text>

    <!-- Parêntese Direito Alto -->
    <text x="377" y="295" font-size="160" font-weight="300" text-anchor="middle">)</text>

    <!-- Braço Direito -->
    <text x="437" y="248" font-size="64" font-weight="900" text-anchor="middle" fill="#00e5ff" opacity="0.8">/</text>
  </g>

  <!-- Subtítulo Echo -->
  <text x="256" y="420" font-family="'JetBrains Mono', 'Consolas', 'Segoe UI', monospace" font-size="28" font-weight="800" fill="#00e5ff" letter-spacing="8" text-anchor="middle" opacity="0.9">ECHO</text>
</svg>
