<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Robô da Luna</title>
  <meta name="theme-color" content="#0b0614">
  <link rel="icon" type="image/svg+xml" href="icon-luna.svg">
  <link rel="stylesheet" href="robo.css?v=2.1">
</head>
<body data-personagem="luna">
  <!-- Página de testes do robô da Luna: mesmos botões da página do Echo, com as cores, os estados e as peças dela -->
  <main class="robo-screen">
    <header class="robo-top">
      <span class="robo-title">LUNA // TESTES</span>
      <span class="robo-status" id="robo-status">Pronta</span>
    </header>

    <section class="robo-stage" id="robo-stage">
      <canvas id="robo-canvas" width="280" height="280" aria-label="Robô da Luna"></canvas>
    </section>

    <!-- Grupos de botões montados pelo robo.js -->
    <section class="robo-controls" id="robo-controls" aria-label="Animações"></section>
  </main>

  <script src="robo-roupas.js?v=1.1"></script>
  <script src="robo-roupas-luna.js?v=1.1"></script>
  <!-- Peças da Luna em teste (ainda não estão na Luna de verdade) -->
  <script src="robo-roupas-luna-teste.js?v=1.1"></script>
  <script src="robo-motor.js?v=1.3"></script>
  <script src="robo.js?v=3.3"></script>
</body>
</html>
